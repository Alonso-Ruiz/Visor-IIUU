<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/app.css">
        <title>Plano de Usos - San Borja</title>
        <script src="js/usos.js"></script>
        <script src="js/actividades.js"></script>
        <script src="js/actividades_zre.js"></script>
        <script src="data/vias.js"></script>
    </head>
    <body>
        <div id="map"></div>

        <div id="bloque-superior-izquierdo">
            <div id="tarjeta-titulo">
                <div class="icono-mapa"><i class="fas fa-map-marked-alt"></i></div>
                <div class="texto-titulo">
                    <h1>Plano de Usos Compatibles</h1>
                    <h2>Distrito de San Borja</h2>
                </div>
            </div>

            <div id="buscador-vias-container">
                <i class="fas fa-search icono-lupa"></i>
                <input type="text" id="buscador-vias" placeholder="Buscar vía..." autocomplete="off" aria-label="Buscar vía">
                <div id="sugerencias-vias"></div>
            </div>
        </div>

        <div id="panel-usos" class="minimizado">
            <div class="cabecera-negra">
                <div class="area-arrastre" id="boton-arrastre"><div class="barra-movil"></div></div>
                <div class="panel-titulos">
                    <h4>Detalle del lote</h4>
                    <h3 id="nombre-uso-titulo">Seleccione un polígono</h3>
                    <p id="ayuda-panel">Haz clic en un lote del mapa para consultar usos compatibles.</p>
                </div>
                <input type="text" id="buscador-actividad" placeholder="Buscar actividad..." aria-label="Buscar actividad compatible">
            </div>

            <div id="contenido-scrollable">
                <div id="ventanas-zona">
                    <div id="ventana-observaciones">
                        <h5>Observaciones</h5>
                        <span id="texto-observaciones"></span>
                    </div>
                    <div id="ventana-restricciones">
                        <h5>Restricciones</h5>
                        <span id="texto-restricciones"></span>
                    </div>
                </div>
                <p id="conteo-resumen">
                    Haz clic en un polígono del mapa para consultar...
                </p>
                <div id="lista-clases-container"></div>
            </div>
        </div>

        <script src="js/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet-textpath@1.2.3/leaflet.textpath.min.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>

        <script src="data/usos_compatibles_1.js"></script>
        <script src="data/bordes_2.js"></script>

        <script src="js/app/core.js"></script>
        <script src="js/app/layers.js"></script>
        <script src="js/app/controls.js"></script>
        <script src="js/app/panel.js"></script>
        <script src="js/app/vias-search.js"></script>
    </body>
</html>
