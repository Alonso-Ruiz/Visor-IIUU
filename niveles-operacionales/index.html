<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visor 3 · Retiros normativos | San Borja</title>
    <style>
        html, body, iframe {
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            overflow: hidden;
            background: #eef2f0;
        }
        iframe { display: block; visibility: hidden; }
    </style>
</head>
<body>
    <iframe id="visor" title="Visor de retiros normativos de San Borja"></iframe>
    <script>
        (function () {
            var frame = document.getElementById('visor');
            frame.addEventListener('load', function () {
                try {
                    var botonRetiros = frame.contentDocument.querySelector('[data-open-retiros]');
                    if (botonRetiros) botonRetiros.click();
                    frame.style.visibility = 'visible';
                } catch (error) {
                    frame.style.visibility = 'visible';
                }
            });
            frame.src = '../index.html';
        })();
    </script>
</body>
</html>
